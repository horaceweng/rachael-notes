<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手寫筆記</title>
    <style>
        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --border-color: #e0e0e0;
            --accent-color: #0066cc;
            --blockquote-border: #cccccc;
            --blockquote-text: #555555;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --text-primary: #e0e0e0;
                --text-secondary: #999999;
                --bg-primary: #1a1a1a;
                --bg-secondary: #2a2a2a;
                --border-color: #444444;
                --accent-color: #4d9eff;
                --blockquote-border: #555555;
                --blockquote-text: #aaaaaa;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
        }

        [hidden] { display: none !important; }

        /* Library view */
        #library { flex: 1; overflow-y: auto; padding: 24px 16px; }
        #library h1 { font-size: 24px; margin: 0 auto 20px; max-width: 1100px; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .card:hover { border-color: var(--accent-color); }
        .card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; background: #fff; }
        .card-body { padding: 10px 12px 12px; }
        .card-title { font-weight: 600; font-size: 16px; }
        .card-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .card-pages { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        .not-found { max-width: 1100px; margin: 40px auto; font-size: 18px; }
        .not-found a { color: var(--accent-color); }

        .back-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
            flex: 0 0 auto;
        }
        #docSelect {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            max-width: 200px;
            flex: 0 0 auto;
        }

        /* Top bar */
        .top-bar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .top-bar-title {
            font-size: 18px;
            font-weight: 600;
            flex: 0 0 auto;
        }

        .page-info {
            font-size: 14px;
            color: var(--text-secondary);
            flex: 0 0 auto;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
        }

        button {
            padding: 6px 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button:active {
            opacity: 0.6;
        }

        .page-input-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        #pageInput {
            width: 60px;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .font-size-controls {
            display: flex;
            gap: 4px;
            flex: 0 0 auto;
            margin-left: auto;
        }

        .font-size-btn {
            padding: 6px 10px;
            font-size: 12px;
            min-width: 36px;
        }

        .font-size-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-primary);
        }

        /* Main layout container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* Two-pane layout */
        .pane {
            overflow: hidden;
            position: relative;
        }

        .left-pane, .right-pane {
            min-width: 0;
            min-height: 0;
        }

        .left-pane {
            flex: 0 0 50%;
            border-right: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-secondary);
        }

        .right-pane {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        /* Image viewer */
        .image-viewer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            overflow: hidden;
            cursor: zoom-in;
        }

        .image-viewer.panning { cursor: grabbing; }

        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            touch-action: none;
            -webkit-user-drag: none;
        }

        .image-viewer img.zoomed {
            cursor: grabbing;
        }

        /* Text content */
        .text-content {
            max-width: 38em;
            font-size: calc(1em * var(--font-scale, 1));
            line-height: 1.9;
            font-family: "Noto Serif TC", "Songti TC", "PingFang TC", serif;
            word-break: break-word;
        }

        .text-content h1,
        .text-content h2,
        .text-content h3 {
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            font-weight: 600;
        }

        .text-content p {
            margin-bottom: 1em;
        }

        .text-content blockquote {
            border-left: 3px solid var(--blockquote-border);
            padding-left: 1em;
            margin: 1em 0;
            color: var(--blockquote-text);
            font-style: italic;
            opacity: 0.9;
        }

        .text-content ul,
        .text-content ol {
            margin-left: 2em;
            margin-bottom: 1em;
        }

        .text-content li {
            margin-bottom: 0.5em;
        }

        /* Divider */
        .divider {
            width: 4px;
            background-color: var(--border-color);
            cursor: col-resize;
            flex-shrink: 0;
            transition: background-color 0.2s;
            position: relative;
            z-index: 10;
            touch-action: none;
        }

        /* Wider invisible grab area so the divider is easy to hit with a finger */
        .divider::before {
            content: "";
            position: absolute;
            inset: 0 -8px;
        }

        .divider:hover {
            background-color: var(--accent-color);
        }

        .divider.dragging {
            background-color: var(--accent-color);
        }

        /* Mobile responsive */
        @media (max-width: 767px) {
            .container {
                flex-direction: column;
                gap: 0;
            }

            .left-pane {
                flex: 0 0 50%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .right-pane {
                flex: 0 0 50%;
                padding: 16px;
            }

            .divider {
                width: 100%;
                height: 4px;
                cursor: row-resize;
            }

            .divider::before {
                inset: -8px 0;
            }

            .top-bar {
                flex-wrap: nowrap;
                gap: 8px;
                padding: 6px 10px;
            }

            #docSelect,
            .top-bar-title,
            .page-input-container label {
                display: none;
            }

            #pageInput {
                width: 48px;
                padding: 4px 6px;
            }

            button {
                padding: 6px 10px;
            }

            .font-size-btn {
                min-width: 30px;
                padding: 6px 6px;
            }
        }
    </style>
</head>
<body>
    <div id="library" hidden>
        <h1>手寫筆記</h1>
        <div class="card-grid" id="cardGrid"></div>
    </div>
    <div class="not-found" id="notFound" hidden>
        <p>找不到這份文件</p>
        <p><a href="./">← 回到文件列表</a></p>
    </div>

    <div class="top-bar" id="topBar" hidden>
        <a class="back-link" href="./">☰ 文件</a>
        <select id="docSelect" aria-label="切換文件"></select>
        <div class="top-bar-title" id="title"></div>
        <div class="page-info">
            <span id="pageNumber">1</span> / <span id="totalPages">1</span>
        </div>
        <div class="nav-buttons">
            <button id="prevBtn">← 上一頁</button>
            <button id="nextBtn">下一頁 →</button>
        </div>
        <div class="page-input-container">
            <label for="pageInput">跳頁：</label>
            <input type="number" id="pageInput" min="1" max="49" value="1">
        </div>
        <div class="font-size-controls">
            <button class="font-size-btn" id="fontSizeDown" title="縮小字體">A−</button>
            <button class="font-size-btn active" id="fontSizeNormal" title="正常字體">A</button>
            <button class="font-size-btn" id="fontSizeUp" title="放大字體">A+</button>
        </div>
    </div>

    <div class="container" id="reader" hidden>
        <div class="left-pane">
            <div class="image-viewer" id="imageViewer">
                <img id="pageImage" alt="頁面">
            </div>
        </div>
        <div class="divider" id="divider"></div>
        <div class="right-pane">
            <div class="text-content" id="textContent"></div>
        </div>
    </div>

    <script src="library.js"></script>
    <!-- Local-only list including unpublished docs; absent (404) on the deployed site. -->
    <script src="library.preview.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script>
        // State
        let currentPage = 1;
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let isDraggingImage = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let isDividerseparating = false;
        let dividerStartPos = 0;
        let leftPaneStart = 0;

        // DOM elements
        const imageViewer = document.getElementById('imageViewer');
        const pageImage = document.getElementById('pageImage');
        const textContent = document.getElementById('textContent');
        const pageNumberSpan = document.getElementById('pageNumber');
        const totalPagesSpan = document.getElementById('totalPages');
        const pageInput = document.getElementById('pageInput');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const divider = document.getElementById('divider');
        const leftPane = document.querySelector('.left-pane');
        const rightPane = document.querySelector('.right-pane');
        const fontSizeDown = document.getElementById('fontSizeDown');
        const fontSizeNormal = document.getElementById('fontSizeNormal');
        const fontSizeUp = document.getElementById('fontSizeUp');
        const container = document.querySelector('.container');

        let PAGES = [];
        let currentSlug = null;

        // Load state from localStorage
        function loadState() {
            try {
                const ratio = localStorage.getItem('dividerRatio');
                if (ratio) {
                    setDividerRatio(parseFloat(ratio));
                }
                const fontSize = localStorage.getItem('fontSize');
                if (fontSize) {
                    setFontSize(parseFloat(fontSize));
                }
            } catch (e) {
                // localStorage unavailable
            }
        }

        // Save divider ratio to localStorage
        function saveDividerRatio(ratio) {
            try {
                localStorage.setItem('dividerRatio', ratio);
            } catch (e) {
                // localStorage unavailable
            }
        }

        // Save font size to localStorage
        function saveFontSize(scale) {
            try {
                localStorage.setItem('fontSize', scale);
            } catch (e) {
                // localStorage unavailable
            }
        }

        // Set divider ratio
        let currentDividerRatio = 0.5;
        function setDividerRatio(ratio) {
            ratio = Math.max(0.2, Math.min(0.8, ratio));
            currentDividerRatio = ratio;
            leftPane.style.flex = `0 0 ${ratio * 100}%`;
            rightPane.style.flex = '1';
        }

        function currentFontScale() {
            return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) || 1;
        }

        // Set font size
        function setFontSize(scale) {
            scale = Math.max(0.8, Math.min(1.6, Math.round(scale * 10) / 10));
            document.documentElement.style.setProperty('--font-scale', scale);

            fontSizeNormal.classList.toggle('active', Math.abs(scale - 1.0) < 0.01);

            saveFontSize(scale);
        }

        // Update page display
        function updatePage(pageNum) {
            if (!PAGES.length) return;
            pageNum = Math.max(1, Math.min(PAGES.length, pageNum));
            currentPage = pageNum;
            try { localStorage.setItem('lastPage:' + currentSlug, pageNum); } catch (e) {}

            const pageData = PAGES[pageNum - 1];

            // Update image
            pageImage.src = pageData.img;
            pageImage.alt = `第 ${pageNum} 頁`;

            // Reset zoom
            zoom = 1;
            panX = 0;
            panY = 0;
            updateImageTransform();

            // Update text
            textContent.innerHTML = marked.parse(pageData.md);

            // Scroll text to top
            rightPane.scrollTop = 0;

            // Update page info
            pageNumberSpan.textContent = pageNum;
            pageInput.value = pageNum;

            // Update URL hash
            history.replaceState(null, '', location.pathname + location.search + `#p=${pageNum}`);

            // Preload next page
            if (pageNum < PAGES.length) {
                const nextPageData = PAGES[pageNum];
                const preloadImg = new Image();
                preloadImg.src = nextPageData.img;
            }
        }

        // Update image transform
        function updateImageTransform() {
            pageImage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        }

        // Handle page navigation
        function goToPage(pageNum) {
            updatePage(pageNum);
        }

        function prevPage() {
            goToPage(currentPage - 1);
        }

        function nextPage() {
            goToPage(currentPage + 1);
        }

        // Image zoom / pan / swipe (pointer events: mouse, touch, pen)
        const pointers = new Map();
        let pinchStartDist = 0, pinchStartZoom = 1;
        let gestureStartX = 0, gestureStartY = 0, gestureMulti = false;
        let lastTapTime = 0;

        function viewerPoint(clientX, clientY) {
            const r = imageViewer.getBoundingClientRect();
            return { x: clientX - r.left - r.width / 2, y: clientY - r.top - r.height / 2 };
        }

        // Zoom to newZoom keeping the image point under (clientX, clientY) fixed.
        function zoomAt(newZoom, clientX, clientY) {
            newZoom = Math.max(1, Math.min(5, newZoom));
            const q = viewerPoint(clientX, clientY);
            panX = q.x - (q.x - panX) * newZoom / zoom;
            panY = q.y - (q.y - panY) * newZoom / zoom;
            zoom = newZoom;
            if (zoom === 1) { panX = 0; panY = 0; }
            clampPan();
            updateImageTransform();
        }

        function resetZoom() {
            zoom = 1; panX = 0; panY = 0;
            updateImageTransform();
        }

        imageViewer.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002));
            zoomAt(zoom * factor, e.clientX, e.clientY);
        }, { passive: false });

        imageViewer.addEventListener('pointerdown', (e) => {
            imageViewer.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pointers.size === 1) {
                gestureStartX = e.clientX; gestureStartY = e.clientY; gestureMulti = false;
            } else if (pointers.size === 2) {
                const [a, b] = [...pointers.values()];
                pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
                pinchStartZoom = zoom;
                gestureMulti = true;
            }
        });

        imageViewer.addEventListener('pointermove', (e) => {
            const prev = pointers.get(e.pointerId);
            if (!prev) return;
            const cur = { x: e.clientX, y: e.clientY };
            pointers.set(e.pointerId, cur);
            if (pointers.size === 2) {
                const [a, b] = [...pointers.values()];
                const dist = Math.hypot(a.x - b.x, a.y - b.y);
                if (pinchStartDist > 0) zoomAt(pinchStartZoom * dist / pinchStartDist, (a.x + b.x) / 2, (a.y + b.y) / 2);
            } else if (pointers.size === 1 && zoom > 1) {
                panX += cur.x - prev.x;
                panY += cur.y - prev.y;
                clampPan();
                updateImageTransform();
            }
            imageViewer.classList.toggle('panning', zoom > 1);
        });

        function endPointer(e) {
            if (!pointers.has(e.pointerId)) return;
            pointers.delete(e.pointerId);
            imageViewer.classList.remove('panning');
            if (pointers.size > 0 || gestureMulti) {
                if (pointers.size === 0) gestureMulti = false;
                return;
            }
            const dx = e.clientX - gestureStartX, dy = e.clientY - gestureStartY;
            if (e.pointerType !== 'mouse' && zoom === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                dx > 0 ? prevPage() : nextPage();
                return;
            }
            // Double-tap (touch) toggles 2.5x zoom / reset; mouse uses dblclick below.
            if (e.pointerType === 'touch' && Math.hypot(dx, dy) < 10) {
                const now = Date.now();
                if (now - lastTapTime < 300) {
                    zoom > 1 ? resetZoom() : zoomAt(2.5, e.clientX, e.clientY);
                    lastTapTime = 0;
                } else {
                    lastTapTime = now;
                }
            }
        }
        imageViewer.addEventListener('pointerup', endPointer);
        imageViewer.addEventListener('pointercancel', endPointer);

        imageViewer.addEventListener('dblclick', (e) => {
            zoom > 1 ? resetZoom() : zoomAt(2.5, e.clientX, e.clientY);
        });

        // Clamp pan values
        function clampPan() {
            const maxPanX = pageImage.offsetWidth * (zoom - 1) / 2;
            const maxPanY = pageImage.offsetHeight * (zoom - 1) / 2;
            panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
            panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
        }

        // Button click handlers
        prevBtn.addEventListener('click', prevPage);
        nextBtn.addEventListener('click', nextPage);

        pageInput.addEventListener('change', () => {
            const pageNum = parseInt(pageInput.value, 10);
            if (!isNaN(pageNum)) {
                goToPage(pageNum);
            }
        });

        // Ignore keyboard navigation when in input
        pageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const pageNum = parseInt(pageInput.value, 10);
                if (!isNaN(pageNum)) {
                    goToPage(pageNum);
                }
                e.preventDefault();
            }
            e.stopPropagation();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === pageInput) {
                return;
            }

            if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextPage();
            }
        });

        // Font size controls
        fontSizeDown.addEventListener('click', () => {
            setFontSize(currentFontScale() - 0.1);
        });

        fontSizeNormal.addEventListener('click', () => {
            setFontSize(1.0);
        });

        fontSizeUp.addEventListener('click', () => {
            setFontSize(currentFontScale() + 0.1);
        });

        // Divider drag (horizontal on desktop, vertical on mobile)
        const isMobile = () => window.matchMedia('(max-width: 767px)').matches;
        let dividerDragging = false;

        divider.addEventListener('pointerdown', (e) => {
            dividerDragging = true;
            divider.setPointerCapture(e.pointerId);
            divider.classList.add('dragging');
            e.preventDefault();
        });

        divider.addEventListener('pointermove', (e) => {
            if (!dividerDragging) return;
            const r = container.getBoundingClientRect();
            const ratio = isMobile()
                ? (e.clientY - r.top) / r.height
                : (e.clientX - r.left) / r.width;
            setDividerRatio(ratio);
        });

        function endDividerDrag() {
            if (!dividerDragging) return;
            dividerDragging = false;
            divider.classList.remove('dragging');
            saveDividerRatio(currentDividerRatio);
            clampPan();
            updateImageTransform();
        }
        divider.addEventListener('pointerup', endDividerDrag);
        divider.addEventListener('pointercancel', endDividerDrag);


        // Handle hash routing
        function handleHashChange() {
            const hash = window.location.hash;
            if (hash.startsWith('#p=')) {
                const pageNum = parseInt(hash.substring(3), 10);
                if (!isNaN(pageNum)) {
                    updatePage(pageNum);
                }
            }
        }

        // Library view
        function showLibrary() {
            document.title = '手寫筆記';
            const grid = document.getElementById('cardGrid');
            window.LIBRARY.forEach((d) => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = '?doc=' + encodeURIComponent(d.slug);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = d.cover;
                img.alt = d.title;
                const body = document.createElement('div');
                body.className = 'card-body';
                const t = document.createElement('div');
                t.className = 'card-title';
                t.textContent = d.title;
                const st = document.createElement('div');
                st.className = 'card-sub';
                st.textContent = d.subtitle || '';
                const pg = document.createElement('div');
                pg.className = 'card-pages';
                pg.textContent = d.pages + ' 頁';
                body.append(t, st, pg);
                a.append(img, body);
                grid.appendChild(a);
            });
            document.getElementById('library').hidden = false;
        }

        function showNotFound() {
            document.title = '找不到這份文件';
            document.getElementById('notFound').hidden = false;
        }

        // Reader view
        function startReader(doc) {
            PAGES = doc.pages;
            currentSlug = doc.slug;
            document.title = doc.title;
            document.getElementById('title').textContent = doc.title;
            totalPagesSpan.textContent = PAGES.length;
            pageInput.max = PAGES.length;
            const sel = document.getElementById('docSelect');
            window.LIBRARY.forEach((d) => {
                const o = document.createElement('option');
                o.value = d.slug;
                o.textContent = d.title + (d.subtitle ? ' · ' + d.subtitle : '');
                if (d.slug === doc.slug) o.selected = true;
                sel.appendChild(o);
            });
            sel.addEventListener('change', () => {
                location.href = '?doc=' + encodeURIComponent(sel.value);
            });
            document.getElementById('topBar').hidden = false;
            document.getElementById('reader').hidden = false;
            loadState();
            window.addEventListener('hashchange', handleHashChange);
            if (/^#p=\d+/.test(location.hash)) {
                handleHashChange();
            } else {
                let last = 1;
                try { last = parseInt(localStorage.getItem('lastPage:' + currentSlug), 10) || 1; } catch (e) {}
                updatePage(last);
            }
        }

        (function init() {
            const slug = new URLSearchParams(location.search).get('doc');
            if (slug === null) { showLibrary(); return; }
            if (!/^[a-z0-9-]+$/.test(slug) || !window.LIBRARY.some((d) => d.slug === slug)) {
                showNotFound();
                return;
            }
            const s = document.createElement('script');
            s.src = 'docs/' + slug + '/data.js';
            s.onload = () => startReader(window.DOC);
            s.onerror = showNotFound;
            document.body.appendChild(s);
        })();
    </script>
</body>
</html>
